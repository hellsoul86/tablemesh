# Tokem local connection. Replace the launcher placeholder with your checkout path.
# Keep credentials in the invoking process environment, not this file.
[mcp_servers.tablemesh]
command = "node"
args = ["/REPLACE_WITH_CHECKOUT/plugins/tablemesh/launch.mjs"]
env_vars = ["TABLEMESH_TOKEN", "TABLEMESH_URL", "TABLEMESH_REPO_ROOT"]
startup_timeout_sec = 15
tool_timeout_sec = 15
